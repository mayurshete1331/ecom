<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Sprout Stem & Leaves -->
  <g transform="translate(106, 80)">
    <!-- Central Curved Stem -->
    <path d="M 150 320 C 150 200, 160 140, 150 40" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Left Leaf (Matki sprout) -->
    <path d="M 150 200 C 60 180, 20 120, 40 60 C 100 60, 140 130, 150 200 Z" fill="url(#leafGrad)" />

    <!-- Right Leaf (Broccoli / Green leaf) -->
    <path d="M 150 140 C 240 120, 280 60, 260 0 C 200 0, 160 70, 150 140 Z" fill="#6ee7b7" />

    <!-- Quick Commerce Speed Lightning Bolt -->
    <path d="M 150 180 L 190 180 L 170 240 L 210 240 L 140 330 L 155 260 L 125 260 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Brand Subtext KD -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">KISANDIRECT</text>
</svg>
